name: Build audit document

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-document:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Baixa todo o histórico para permitir o rebase de forma limpa
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pdf/package-lock.json

      - name: Install dependencies
        run: npm --prefix pdf ci

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Build consolidated PDF
        run: npm --prefix pdf run build:pdf

      - name: Commit generated dist
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- pdf/output/relatorio_final.pdf; then
            echo "No generated document changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf/output/relatorio_final.pdf
          git commit -m "docs: atualiza documento consolidado FIAR [skip ci]"
          
          # Baixa as alterações remotas mais recentes antes do push
          git pull --rebase origin main
          git push

      - name: Upload generated document
        uses: actions/upload-artifact@v4
        with:
          name: documento-auditoria-fiar
          path: pdf/output/relatorio_final.pdf
